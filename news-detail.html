<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEWS DETAIL | ORB GARDEN</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- CSS読み込み -->
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/top.css">
  
  <style>
    .news-detail-section { 
      padding: 60px 0 100px; 
      background: #ffffff; /* 白背景を明示 */
    }
    .news-detail-content {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    .news-detail-meta {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
    }
    .news-detail-date {
      color: #64748b; /* 濃いめのグレーで見やすく */
      font-size: 0.95rem;
    }
    .news-detail-tag {
      font-size: 0.8rem;
      padding: 4px 10px;
      background: var(--accent-color, #00d2ff);
      color: #000000;
      font-weight: 800;
      border-radius: 4px;
    }
    .news-detail-title {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a; /* 濃い黒・紺色でクッキリ表示 */
      line-height: 1.4;
      margin-bottom: 30px;
      word-break: break-word;
    }
    .news-detail-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 40px;
      background: #f1f5f9;
    }
    .news-detail-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .news-detail-body {
      font-size: 1.05rem;
      line-height: 2;
      color: #1e293b; /* 本文も濃い黒字で視認性を確保 */
      white-space: pre-line;
      word-break: break-word;
    }
    .news-detail-body a {
      color: #0284c7;
      text-decoration: underline;
    }
    .news-detail-body a:hover {
      opacity: 0.8;
    }

    /* スマホ表示時の最適化 */
    @media (max-width: 768px) {
      .news-detail-section {
        padding: 30px 0 60px;
      }
      .news-detail-title {
        font-size: 1.4rem;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      .news-detail-thumb {
        margin-bottom: 25px;
      }
      .news-detail-body {
        font-size: 0.95rem;
        line-height: 1.8;
      }
    }
  </style>
</head>
<body>

  <!-- 共通ヘッダー -->
  <div id="header-placeholder"></div>

  <main class="news-detail-section">
    <div class="container">
      
      <!-- 記事表示エリア（カード化なし・白背景用テキストカラー） -->
      <article class="news-detail-content" id="newsDetailContainer">
        <p style="text-align: center; color: #64748b;">記事を読み込み中...</p>
      </article>

      <!-- ニュース一覧に戻るボタン -->
      <div class="back-btn-container" style="margin-top: 60px; text-align: center;">
        <a href="news.html" class="btn-primary">ニュース一覧に戻る</a>
      </div>

    </div>
  </main>

  <!-- 共通フッター -->
  <div id="footer-placeholder"></div>

  <!-- ニュースデータと制御JS -->
  <script src="assets/js/news-data.js"></script>
  <script src="assets/js/header.js"></script>
  <script src="assets/js/footer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const newsId = parseInt(params.get('id'));
      const container = document.getElementById('newsDetailContainer');

      const targetNews = newsData.find(item => item.id === newsId) || newsData[0];

      document.title = `${targetNews.title} | ORB GARDEN`;
      container.innerHTML = `
        <div class="news-detail-meta">
          <span class="news-detail-date">${targetNews.date}</span>
          <span class="news-detail-tag">${targetNews.tag}</span>
        </div>
        <h1 class="news-detail-title">${targetNews.title}</h1>
        <div class="news-detail-thumb">
          <img src="${targetNews.thumbnail}" alt="${targetNews.title}" onerror="this.style.background='#cbd5e1'">
        </div>
        <div class="news-detail-body">${targetNews.content}</div>
      `;
    });
  </script>
</body>
</html>
