<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEWS DETAIL | ORB GARDEN</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- CSS読み込み -->
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/top.css">
  
  <style>
    .news-detail-section { 
      padding: 60px 0 100px; 
    }
    .news-detail-card {
      background: #1e293b; /* 他ページと共通のダークカード背景 */
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      color: #ffffff;
    }
    .news-detail-meta {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
    }
    .news-detail-date {
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .news-detail-tag {
      font-size: 0.75rem;
      padding: 4px 10px;
      background: var(--accent-color, #00d2ff);
      color: #000000;
      font-weight: 800;
      border-radius: 4px;
    }
    .news-detail-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.5;
      margin-bottom: 30px;
      word-break: break-all;
    }
    .news-detail-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 35px;
      background: #0f172a;
    }
    .news-detail-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .news-detail-body {
      font-size: 1rem;
      line-height: 2;
      color: #e2e8f0;
      white-space: pre-line;
      word-break: break-all;
    }
    .news-detail-body a {
      color: var(--accent-color, #00d2ff);
      text-decoration: underline;
    }
    .news-detail-body a:hover {
      opacity: 0.8;
    }

    /* スマホ表示時の余白調整 */
    @media (max-width: 768px) {
      .news-detail-card {
        padding: 20px;
        border-radius: 12px;
      }
      .news-detail-title {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <!-- 共通ヘッダー -->
  <div id="header-placeholder"></div>

  <main class="news-detail-section">
    <div class="container">
      <div class="news-detail-card" id="newsDetailContainer">
        <p style="text-align: center; color: #94a3b8;">記事を読み込み中...</p>
      </div>

      <!-- ニュース一覧に戻るボタン -->
      <div class="back-btn-container" style="margin-top: 40px; text-align: center;">
        <a href="news.html" class="btn-primary">ニュース一覧に戻る</a>
      </div>
    </div>
  </main>

  <!-- 共通フッター -->
  <div id="footer-placeholder"></div>

  <!-- ニュースデータと制御JS -->
  <script src="assets/js/news-data.js"></script>
  <script src="assets/js/header.js"></script>
  <script src="assets/js/footer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const newsId = parseInt(params.get('id'));
      const container = document.getElementById('newsDetailContainer');

      const targetNews = newsData.find(item => item.id === newsId) || newsData[0];

      document.title = `${targetNews.title} | ORB GARDEN`;
      container.innerHTML = `
        <div class="news-detail-meta">
          <span class="news-detail-date">${targetNews.date}</span>
          <span class="news-detail-tag">${targetNews.tag}</span>
        </div>
        <h1 class="news-detail-title">${targetNews.title}</h1>
        <div class="news-detail-thumb">
          <img src="${targetNews.thumbnail}" alt="${targetNews.title}" onerror="this.style.background='#1e293b'">
        </div>
        <div class="news-detail-body">${targetNews.content}</div>
      `;
    });
  </script>
</body>
</html>
