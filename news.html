<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INFORMATION | ORB GARDEN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/common.css">
  <style>
    .sub-hero { padding: 60px 0; background-color: var(--header-bg); color: #fff; text-align: center; }
    .sub-hero h1 { font-family: var(--font-en); font-size: 2.5rem; font-weight: 900; letter-spacing: 2px; }
    .news-list-section { padding: 80px 0; }
    .news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; max-width: 1200px; margin: 0 auto; }
    .news-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .news-thumb { aspect-ratio: 16/9; background: #f1f5f9; }
    .news-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .news-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
    .news-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 0.8rem; color: var(--text-sub); font-family: var(--font-en); font-weight: 700; }
    .news-tag { background: rgba(0,210,255,0.1); color: var(--accent-color); padding: 2px 8px; border-radius: 4px; }
    .news-title { font-size: 1.05rem; font-weight: 700; color: var(--text-main); line-height: 1.5; }
    @media(max-width:992px) { .news-grid { grid-template-columns: repeat(2, 1fr); } }
    @media(max-width:768px) { .news-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="sub-hero">
    <div class="container">
      <h1>INFORMATION</h1>
    </div>
  </div>

  <main class="news-list-section container">
    <div class="news-grid">
      <article class="news-card">
        <div class="news-thumb"><img src="assets/images/sample-news1.jpg" alt="ニュース" onerror="this.style.background='#cbd5e1'"></div>
        <div class="news-body">
          <div class="news-meta"><span class="news-date">2026.10.14</span><span class="news-tag">MEDIA</span></div>
          <h3 class="news-title">茨城県教育委員会公式サイト「おしえて ふれあちゃん！」にORB GARDENが掲載されました！</h3>
        </div>
      </article>
      <article class="news-card">
        <div class="news-thumb"><img src="assets/images/sample-news2.jpg" alt="ニュース" onerror="this.style.background='#cbd5e1'"></div>
        <div class="news-body">
          <div class="news-meta"><span class="news-date">2026.10.01</span><span class="news-tag">TEAM</span></div>
          <h3 class="news-title">APEX競技部門 新メンバー加入のお知らせ</h3>
        </div>
      </article>
      <article class="news-card">
        <div class="news-thumb"><img src="assets/images/sample-news3.jpg" alt="ニュース" onerror="this.style.background='#cbd5e1'"></div>
        <div class="news-body">
          <div class="news-meta"><span class="news-date">2026.09.01</span><span class="news-tag">SPONSOR</span></div>
          <h3 class="news-title">【お知らせ】スポンサー契約継続のお知らせ</h3>
        </div>
      </article>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="assets/js/header.js"></script>
  <script src="assets/js/footer.js"></script>
</body>
</html>
