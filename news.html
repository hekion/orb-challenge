<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEWS | ORB GARDEN</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- CSS読み込み（他ページと共通） -->
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/top.css">
  
  <style>
    /* ニュース一覧ページのスタイル統一・視認性強化 */
    .news-page-section {
      padding: 60px 0 100px;
    }
    .news-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }
    .news-card-item {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: #ffffff;
    }
    .news-card-item:hover {
      transform: translateY(-5px);
      border-color: var(--accent-color, #00d2ff);
      box-shadow: 0 10px 25px rgba(0, 210, 255, 0.2);
    }
    .news-card-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      overflow: hidden;
    }
    .news-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .news-card-item:hover .news-card-thumb img {
      transform: scale(1.05);
    }
    .news-card-body {
      padding: 24px 20px;
      background: #1e293b; /* 深みのあるソリッド背景で文字をくっきり表示 */
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .news-card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .news-card-date {
      font-size: 0.85rem;
      color: #94a3b8;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
    }
    .news-card-tag {
      font-size: 0.75rem;
      padding: 3px 8px;
      background: var(--accent-color, #00d2ff);
      color: #000000;
      font-weight: 800;
      border-radius: 4px;
      font-family: 'Montserrat', sans-serif;
    }
    .news-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.6;
      color: #ffffff; /* クッキリとした白文字に固定 */
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- 共通ヘッダー -->
  <div id="header-placeholder"></div>

  <main class="news-page-section">
    <div class="container">
      
      <h2 class="section-title">
        <span class="en">NEWS / INFORMATION</span>
        <span class="ja">最新ニュース・お知らせ一覧</span>
      </h2>

      <!-- ニュースカードグリッド（即時描画領域） -->
      <div class="news-list-grid" id="newsListContainer">
        <!-- JSで高速描画されます -->
      </div>

    </div>
  </main>

  <!-- 共通フッター -->
  <div id="footer-placeholder"></div>

  <!-- JS読み込み -->
  <script src="assets/js/news-data.js"></script>
  <script src="assets/js/header.js"></script>
  <script src="assets/js/footer.js"></script>

  <!-- 爆速描画処理（元の美しいカードデザインを維持・タイトルのみ） -->
  <script>
    function renderNewsList() {
      const container = document.getElementById('newsListContainer');
      if (!container) return;

      if (typeof newsData !== 'undefined' && newsData.length > 0) {
        container.innerHTML = newsData.map(item => {
          return `
            <a href="news-detail.html?id=${item.id}" class="news-card-item">
              <div class="news-card-thumb">
                <img src="${item.thumbnail}" alt="${item.title}" onerror="this.style.display='none'; this.parentNode.style.background='#1e293b';">
              </div>
              <div class="news-card-body">
                <div class="news-card-meta">
                  <span class="news-card-date">${item.date}</span>
                  <span class="news-card-tag">${item.tag}</span>
                </div>
                <h3 class="news-card-title">${item.title}</h3>
              </div>
            </a>
          `;
        }).join('');
      } else {
        container.innerHTML = '<p style="color: #94a3b8; padding: 40px 0; grid-column: 1/-1; text-align: center;">現在お知らせはありません。</p>';
      }
    }

    // DOMロード後即実行
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderNewsList);
    } else {
      renderNewsList();
    }
  </script>
</body>
</html>
