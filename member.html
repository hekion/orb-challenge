<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMBERS | ORB GARDEN</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- CSS読み込み -->
  <link rel="stylesheet" href="assets/css/common.css">
  <link rel="stylesheet" href="assets/css/top.css">
  <link rel="stylesheet" href="assets/css/member.css">
</head>
<body>

  <!-- 共通ヘッダー -->
  <div id="header-placeholder"></div>

  <!-- MEMBER セクション -->
  <section class="member member-page-section">
    <div class="container">
      
      <h2 class="section-title">
        <span class="en">MEMBERS</span>
        <span class="ja">所属メンバー</span>
      </h2>

      <!-- カテゴリ切り替えタブ（初期選択: ALL） -->
      <div class="member-tabs">
        <button class="tab-btn active" data-category="all">ALL</button>
        <button class="tab-btn" data-category="streamer">STREAMER</button>
        <button class="tab-btn" data-category="staff">STAFF</button>
        <button class="tab-btn" data-category="creator">CREATOR</button>
        <button class="tab-btn" data-category="valorant">VALORANT</button>
        <button class="tab-btn" data-category="apex">APEX LEGENDS</button>
      </div>

      <!-- 横長メンバーカードグリッド（カード画像対応版） -->
      <div class="member-grid">
        
        <!-- ===== STREAMER ===== -->
        <a href="member-detail.html?id=junpeach" class="member-card" data-category="streamer">
          <img src="assets/images/member/card/junpeach.png" alt="じゅんぴーち" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <a href="member-detail.html?id=zaki" class="member-card" data-category="streamer">
          <img src="assets/images/member/card/zaki.png" alt="ザキ" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <a href="member-detail.html?id=nachi" class="member-card" data-category="streamer">
          <img src="assets/images/member/card/nachi.png" alt="なち" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <a href="member-detail.html?id=shirokuma" class="member-card" data-category="streamer">
          <img src="assets/images/member/card/shirokuma.png" alt="白熊アイス" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <a href="member-detail.html?id=opiroyan" class="member-card" data-category="streamer">
          <img src="assets/images/member/card/opiroyan.png" alt="おぴろやん" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <a href="member-detail.html?id=rutodesupon" class="member-card" data-category="streamer">
          <img src="assets/images/member/card/rutodesupon.png" alt="るとですぽん" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <a href="member-detail.html?id=monariza" class="member-card" data-category="streamer">
          <img src="assets/images/member/card/monariza.png" alt="もなりざ" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <!-- ===== STAFF ===== -->
        <a href="member-detail.html?id=kurusu" class="member-card" data-category="staff">
          <img src="assets/images/member/card/kurusu.png" alt="クルス" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <a href="member-detail.html?id=mumurumuru" class="member-card" data-category="staff">
          <img src="assets/images/member/card/mumurumuru.png" alt="mumurumuru" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <a href="member-detail.html?id=pyonaka" class="member-card" data-category="staff">
          <img src="assets/images/member/card/pyonaka.png" alt="ぴょなか" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <!-- ===== CREATOR ===== -->
        <a href="member-detail.html?id=sachie" class="member-card" data-category="creator">
          <img src="assets/images/member/card/sachie.png" alt="サチエ" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <!-- ===== VALORANT (不在用ダミー) ===== -->
        <div class="member-card hide" data-category="valorant" style="display: none;"></div>

        <!-- ===== APEX LEGENDS ===== -->
        <a href="member-detail.html?id=dex" class="member-card" data-category="apex">
          <img src="assets/images/member/card/dex.png" alt="Dex" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <a href="member-detail.html?id=aurora" class="member-card" data-category="apex">
          <img src="assets/images/member/card/aurora.png" alt="Aurora" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <a href="member-detail.html?id=gyeol" class="member-card" data-category="apex">
          <img src="assets/images/member/card/gyeol.png" alt="Gyeol" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

        <a href="member-detail.html?id=edan" class="member-card" data-category="apex">
          <img src="assets/images/member/card/edan.png" alt="Edan (Coach)" class="member-card-img" onerror="this.style.background='#1e293b'">
        </a>

      </div>

      <!-- 空白時メッセージ -->
      <div id="emptyMessage" class="member-empty" style="display: none;">
        現在、VALORANT部門のメンバーはいません。
      </div>

    </div>
  </section>

  <!-- 共通フッター -->
  <div id="footer-placeholder"></div>

  <!-- JS読み込み -->
  <script src="assets/js/header.js"></script>
  <script src="assets/js/footer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabBtns = document.querySelectorAll('.tab-btn');
      const memberCards = document.querySelectorAll('.member-card');
      const emptyMessage = document.getElementById('emptyMessage');

      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          // すべてのボタンから active を外し、押されたボタンだけに付与する
          tabBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const cat = btn.getAttribute('data-category');
          let visibleCount = 0;

          memberCards.forEach(card => {
            const cardCat = card.getAttribute('data-category');
            
            // 空のダミー要素はカウントから除外
            if (cardCat === '') return;

            if (cat === 'all' || cardCat === cat) {
              card.classList.remove('hide');
              if (card.tagName === 'A') visibleCount++;
            } else {
              card.classList.add('hide');
            }
          });

          if (cat === 'valorant' && visibleCount === 0) {
            emptyMessage.style.display = 'block';
          } else {
            emptyMessage.style.display = 'none';
          }
        });
      });
    });
  </script>
</body>
</html>
